name: prmeasure
description: >-
  prmeasure (Precision Measurement & Control, 精实测控) is a Zhuhai, China based
  high-tech enterprise specializing in measurement, control, and artificial
  intelligence technologies for flexible manufacturing. The company builds
  industrial-grade testing and control equipment for the consumer electronics,
  automotive, and home-appliance industries, and offers consumer-level
  customized production through a C2M (customer-to-manufacturer) model. Its
  WowNow platform (iwownow.com) provides creative prototyping tools and flexible
  manufacturing equipment for individuals. prmeasure was surfaced as a portfolio
  company of the Qiming Venture Partners investment graph and added to the API
  Evangelist network. As of this enrichment pass the company publishes a
  corporate marketing website only, with no public developer portal, API
  documentation, SDKs, or machine-readable API surface.
